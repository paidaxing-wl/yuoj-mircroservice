spring:
  application:
    name: yuoj-backend-judge-service
  # ?? dev ??
  profiles:
    active: dev
  # ?? swagger3
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # session ??
  session:
    store-type: redis
    # 30 ???
    timeout: 2592000
  # ?????
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yuoj
    username: root
    password: 123456
  # Redis ??
  redis:
    database: 1
    host: localhost
    port: 6379
    timeout: 5000
    password: 2247887787
  # ????
  servlet:
    multipart:
      # ????
      max-file-size: 10MB
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  rabbitmq:
    host: localhost
    port: 5672
    password: guest
    username: guest
    # 生产者确认：消息有没有真的到达 Broker，需要 Broker 明确回复
    publisher-confirm-type: correlated
    # 消息无法路由到队列时退回给生产者，避免"发出去了但没人知道丢在哪"
    publisher-returns: true
    template:
      mandatory: true
server:
  address: 0.0.0.0
  port: 8104
  servlet:
    context-path: /api/judge
    # cookie 30 ???
    session:
      cookie:
        max-age: 2592000
        path: /api
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # ????????????
      logic-delete-value: 1 # ?????????? 1?
      logic-not-delete-value: 0 # ?????????? 0?
#??????
codesandbox:
  type: remote
  # 远程沙箱地址（原来硬编码在 RemoteCodeSandbox 里，换环境必须改代码）
  remote-url: http://localhost:8090/executeCode
  # 鉴权信息（原来硬编码为 secretKey，正式环境应通过环境变量注入）
  auth-header: auth
  auth-secret: secretKey
  # 单次调用沙箱的超时时间（毫秒）。原来没有超时，沙箱不响应会一直挂住判题线程
  http-timeout-ms: 10000
  # 沙箱调用失败时的重试次数与退避间隔
  max-attempts: 3
  retry-initial-interval: 2000
  retry-multiplier: 2.0
  retry-max-interval: 30000
knife4j:
  enable: true

# 判题任务消费的重试与死信
yuoj:
  mq:
    # 含第一次执行；重试耗尽后消息进入 code_dlx_queue
    max-attempts: 3
    initial-interval: 2000
    multiplier: 2.0
    max-interval: 30000
    # 重试耗尽后：重置状态并重新投递的最大次数，超过后标记 FAILED 并进死信队列
    max-redeliver-times: 3
    concurrent-consumers: 1
    max-concurrent-consumers: 4
  compensation:
    # 死信队列重放间隔
    dead-letter-replay-interval-ms: 300000
